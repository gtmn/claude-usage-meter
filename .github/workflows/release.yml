# Tests and builds on every push to main that changes more than docs, and every pull request
# (the build is kept as a downloadable artifact). Docs-only pushes (README, docs/, other .md
# files, LICENSE) skip it: they'd only queue for a macOS runner. On a version tag (v0.1.9) it
# also publishes a GitHub release with the app and the claude-usage command, built for Apple
# silicon and Intel Macs.
name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Never applied to tag pushes, so a release tag always builds.
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write   # to create the release on a tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # all tags and history, for the version and the release notes

      - name: Tests
        run: ./test.sh

      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(git describe --tags --always | sed 's/^v//')"
          fi
          .github/package.sh "$version"

      - name: Keep the build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: usage-meter-build
          path: dist/

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --title "Usage Meter ${GITHUB_REF_NAME#v}" --notes-file dist/NOTES.md --verify-tag
